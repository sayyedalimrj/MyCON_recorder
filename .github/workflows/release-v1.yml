name: Publish MyCON 1.0.0

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "ios/**"
      - "web/**"
      - "tools/**"
      - "RELEASE_NOTES_v1.0.0.md"
      - ".github/workflows/release-v1.yml"
  push:
    branches: [main]
    paths:
      - "RELEASE_NOTES_v1.0.0.md"
      - ".github/workflows/release-v1.yml"

permissions:
  contents: write

concurrency:
  group: mycon-v1-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate scientific bridge
        run: |
          python -m py_compile tools/mycon_session_check.py
          python tools/qr_pose_math_check.py
          python -m pip install --disable-pip-version-check -q numpy
          python tools/mycon_r4_bridge.py --self-test

      - name: Build Android 1.0.0 APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Name Android release artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk MyCON-Recorder-Android-1.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: MyCON-Recorder-Android-1.0.0.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - run: brew install xcodegen

      - name: Generate iOS project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies -project MyCONRecorderIOS.xcodeproj -scheme MyCONRecorderIOS

      - name: Build iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild             -project MyCONRecorderIOS.xcodeproj             -scheme MyCONRecorderIOS             -configuration Release             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             build

      - name: Build unsigned iPhone device app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild             -project MyCONRecorderIOS.xcodeproj             -scheme MyCONRecorderIOS             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath build-device             CODE_SIGNING_ALLOWED=NO             build

      - name: Package iOS release artifacts
        working-directory: ios
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -qry ../../../../MyCON-Recorder-iOS-1.0.0-simulator.zip "MyCON Recorder.app"
          cd ../../../../
          cd build-device/Build/Products/Release-iphoneos
          zip -qry ../../../../MyCON-Recorder-iOS-1.0.0-device-unsigned.zip "MyCON Recorder.app"

      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: |
            ios/MyCON-Recorder-iOS-1.0.0-simulator.zip
            ios/MyCON-Recorder-iOS-1.0.0-device-unsigned.zip
          if-no-files-found: error
          retention-days: 30

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate Web 1.0
        run: |
          node --check web/app.js
          grep -q "MYCON 1.0" web/index.html
          grep -q "mycon.theme.v1" web/app.js
          grep -q "calibration-cube-1m" web/models/catalog.json
          python3 -m json.tool web/models/catalog.json >/dev/null
          python3 -m json.tool web/models/calibration-cube-1m.gltf >/dev/null

      - name: Package Web/PWA
        run: zip -qry MyCON-Web-1.0.0.zip web

      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: MyCON-Web-1.0.0.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: ${{ github.event_name != 'pull_request' }}
    needs: [android, ios, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release payload
        run: |
          test -f release-assets/MyCON-Recorder-Android-1.0.0.apk
          test -f release-assets/MyCON-Recorder-iOS-1.0.0-simulator.zip
          test -f release-assets/MyCON-Recorder-iOS-1.0.0-device-unsigned.zip
          test -f release-assets/MyCON-Web-1.0.0.zip
          sha256sum release-assets/* | tee release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.0.0               --repo "$GITHUB_REPOSITORY"               --title "MyCON 1.0.0"               --notes-file RELEASE_NOTES_v1.0.0.md
            gh release upload v1.0.0 release-assets/*               --repo "$GITHUB_REPOSITORY"               --clobber
          else
            gh release create v1.0.0 release-assets/*               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "MyCON 1.0.0"               --notes-file RELEASE_NOTES_v1.0.0.md
          fi
