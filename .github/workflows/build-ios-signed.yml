name: Build Signed iOS IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: Export method
        required: true
        default: app-store-connect
        type: choice
        options:
          - app-store-connect
          - ad-hoc

jobs:
  signed-ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      BUNDLE_ID: ir.mycon.capture.ios
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - name: Check signing secrets
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CERT" || (echo "Missing APPLE_CERTIFICATE_P12_BASE64" && exit 2)
          test -n "$CERT_PASS" || (echo "Missing APPLE_CERTIFICATE_PASSWORD" && exit 2)
          test -n "$PROFILE" || (echo "Missing APPLE_PROVISIONING_PROFILE_BASE64" && exit 2)
          test -n "$TEAM" || (echo "Missing APPLE_TEAM_ID" && exit 2)
      - name: Install signing identity
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/mycon.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(/usr/bin/security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | /usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin)
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Archive
        working-directory: ios
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild             -project MyCONRecorderIOS.xcodeproj             -scheme MyCONRecorderIOS             -configuration Release             -destination 'generic/platform=iOS'             -archivePath "$RUNNER_TEMP/MyCON.xcarchive"             DEVELOPMENT_TEAM="$TEAM"             CODE_SIGN_STYLE=Manual             PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"             archive
      - name: Export IPA
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          METHOD: ${{ inputs.export_method }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_UUID</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive             -archivePath "$RUNNER_TEMP/MyCON.xcarchive"             -exportPath "$RUNNER_TEMP/export"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          cp "$RUNNER_TEMP/export/"*.ipa MyCON-Recorder-iOS.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: MyCON-Recorder-iOS-IPA
          path: MyCON-Recorder-iOS.ipa
          if-no-files-found: error
          retention-days: 14
