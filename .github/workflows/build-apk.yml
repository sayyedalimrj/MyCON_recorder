name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "tools/**"
      - "*.gradle.kts"
      - ".github/workflows/build-apk.yml"
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "app/**"
      - "tools/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check Python session validator
        run: python -m py_compile tools/mycon_session_check.py

      - name: Check QR pose math contract
        run: python tools/qr_pose_math_check.py

      - name: Check MyCON R4 bridge contract
        run: |
          python -m pip install --disable-pip-version-check -q numpy
          python tools/mycon_r4_bridge.py --self-test

      - name: Restore stable debug signing key
        id: signing_cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mycon-debug-keystore-v1

      # Never silently generate a new debug key: that would produce an APK
      # unable to update an existing installation without uninstalling it.
      - name: Refuse unknown signing key
        env:
          CACHE_HIT: ${{ steps.signing_cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != "true" ] || [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "::error::Original Android signing key unavailable; refusing unsafe update APK."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Print update compatibility certificate fingerprint
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyCON-Recorder-Android-1.2.1-Recovery
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
