name: MyCONRecorderIOS
options:
  bundleIdPrefix: ir.mycon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

targets:
  MyCONRecorderIOS:
    type: application
    platform: iOS
    sources:
      - path: MyCONRecorderIOS
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ir.mycon.capture.ios
        PRODUCT_NAME: MyCON Recorder
        SWIFT_VERSION: 5.10
        CURRENT_PROJECT_VERSION: 12
        MARKETING_VERSION: 1.1.0
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MyCONRecorderIOS/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      testTargets: []
      gatherCoverageData: false
